<div class="sop-row flex flex-wrap items-end gap-2 border border-gray-200 rounded-md p-2 bg-white">
    <div class="w-28">
        <label class="block text-xs font-medium text-gray-600">Rule ID</label>
        <input type="text" name="rule_id" value="{{ row.rule_id|default:'' }}"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <div class="w-36">
        <label class="block text-xs font-medium text-gray-600">Trigger type</label>
        <select name="rule_trigger_type"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="shift_type" {% if row.trigger_type == "shift_type" %}selected{% endif %}>shift_type</option>
            <option value="category" {% if row.trigger_type == "category" %}selected{% endif %}>category</option>
            <option value="unavailability" {% if row.trigger_type == "unavailability" %}selected{% endif %}>unavailability</option>
        </select>
    </div>
    <div class="w-32">
        <label class="block text-xs font-medium text-gray-600">Trigger value</label>
        <input type="text" name="rule_trigger_value" value="{{ row.trigger_value|default:'' }}"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <div class="w-28">
        <label class="block text-xs font-medium text-gray-600">Direction</label>
        <select name="rule_direction"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="after" {% if row.direction == "after" %}selected{% endif %}>after</option>
            <option value="before" {% if row.direction == "before" %}selected{% endif %}>before</option>
        </select>
    </div>
    <div class="w-36">
        <label class="block text-xs font-medium text-gray-600">Preferred type</label>
        <select name="rule_preferred_type"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="shift_type" {% if row.preferred_type == "shift_type" %}selected{% endif %}>shift_type</option>
            <option value="category" {% if row.preferred_type == "category" %}selected{% endif %}>category</option>
        </select>
    </div>
    <div class="w-32">
        <label class="block text-xs font-medium text-gray-600">Preferred value</label>
        <input type="text" name="rule_preferred_value" value="{{ row.preferred_value|default:'' }}"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <div class="w-20">
        <label class="block text-xs font-medium text-gray-600">Priority</label>
        <input type="number" name="rule_priority" min="1" value="{{ row.priority|default:'' }}"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <div class="flex-1 min-w-[8rem]">
        <label class="block text-xs font-medium text-gray-600">Worker IDs (comma, optional)</label>
        <input type="text" name="rule_worker_ids" value="{{ row.worker_ids|default:'' }}"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
    </div>
    <button type="button" data-remove-row
            class="px-2 py-1.5 text-sm font-medium text-red-600 hover:text-red-800">
        Remove
    </button>
</div>
