# Retail Store Configuration
# Typical retail store with morning, afternoon, evening shifts

solver:
  max_time_seconds: 300
  num_workers: 4

schedule:
  period_type: "week"

# Shift types for retail store
shift_types:
  - id: "morning"
    name: "Morning Shift"
    category: "day"
    start_time: "06:00"
    end_time: "14:00"
    duration_hours: 8.0
    is_undesirable: false
    workers_required: 2

  - id: "afternoon"
    name: "Afternoon Shift"
    category: "day"
    start_time: "14:00"
    end_time: "22:00"
    duration_hours: 8.0
    is_undesirable: false
    workers_required: 2

  - id: "weekend_day"
    name: "Weekend Day"
    category: "weekend"
    start_time: "09:00"
    end_time: "18:00"
    duration_hours: 9.0
    is_undesirable: true
    workers_required: 3
    # Only applies Sat/Sun (0=Mon..6=Sun). Coverage is skipped in any
    # period containing no Sat/Sun (e.g. a truncated final period).
    applicable_days: [5, 6]

# Constraints tuned for retail
constraints:
  coverage:
    enabled: true
    is_hard: true

  restriction:
    enabled: true
    is_hard: true

  availability:
    enabled: true
    is_hard: true

  worker_shift_limit:
    enabled: true
    is_hard: true
    parameters:
      max_shifts_per_period: 1   # Mutually exclusive shifts per worker per period

  fairness:
    enabled: true
    is_hard: false
    weight: 1000
    parameters:
      categories: ["weekend"]

  frequency:
    enabled: false

  request:
    enabled: true
    is_hard: false
    weight: 200

  sequence:
    enabled: false

  max_absence:
    enabled: true
    is_hard: false
    weight: 100
    parameters:
      max_periods_absent: 2

logging:
  level: "INFO"
